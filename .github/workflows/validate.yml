name: Validate skill

on:
  pull_request:
    paths: ['**/*.md', 'SKILL.md']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md has required fields
        run: |
          grep -q "^name: shipright" SKILL.md || (echo "Missing name field" && exit 1)
          grep -q "^version:" SKILL.md || (echo "Missing version field" && exit 1)
          grep -q "^description:" SKILL.md || (echo "Missing description field" && exit 1)
          echo "✓ SKILL.md frontmatter valid"

      - name: Check all branch files exist
        run: |
          for branch in a-new-project b-add-feature c-fix-bug d-refactor e-resume f-incident; do
            test -f "references/branches/${branch}.md" || (echo "Missing: ${branch}.md" && exit 1)
          done
          echo "✓ All branch files present"

      - name: Check examples exist
        run: |
          test -f "references/examples/orders-api-CLAUDE.md" || (echo "Missing example" && exit 1)
          test -f "references/examples/orders-api-ARCHITECTURE.md" || (echo "Missing example" && exit 1)
          echo "✓ Example files present"

      - name: Check no broken internal reference links (hard fail)
        run: |
          # CHANGELOG is a historical record — allowed to mention intentionally-removed files.
          grep -rhoE 'references/[a-zA-Z0-9/_-]+\.md' --include='*.md' --exclude=CHANGELOG.md . | sort -u > /tmp/refs.txt
          rc=0
          while read ref; do
            if [ ! -f "$ref" ]; then echo "BROKEN LINK: $ref"; rc=1; fi
          done < /tmp/refs.txt
          if [ $rc -ne 0 ]; then exit 1; fi
          echo "✓ No broken reference links"

      - name: Check no orphaned reference files (hard fail)
        run: |
          # A reference file must be linked from a live file (CHANGELOG mention does not count).
          rc=0
          for f in $(find references -name '*.md'); do
            base=$(basename "$f")
            if ! grep -rqF "$base" --include='*.md' --exclude="$base" --exclude=CHANGELOG.md .; then
              echo "ORPHAN (referenced nowhere live): $f"; rc=1
            fi
          done
          if [ $rc -ne 0 ]; then exit 1; fi
          echo "✓ No orphaned reference files"

      - name: Check must-fire refs have a live situation-trigger (no DARK spots — hard fail)
        run: |
          # v1.17 fitness function: a ref in EVALS.md's ```must-fire block must be reachable mid-session
          # via a concrete trigger, not merely catalogued in the reference index. Trigger zone =
          # SKILL.md ABOVE the "Reference files" index + all branch files. Basename match (refs are cited
          # both as `references/x.md` and bare `x.md`), consistent with the orphan check.
          idx=$(grep -n '^## Reference files' SKILL.md | head -1 | cut -d: -f1)
          if [ -z "$idx" ]; then echo "Cannot find reference-index anchor in SKILL.md"; exit 1; fi
          head -n $((idx-1)) SKILL.md > /tmp/tz.txt
          cat references/branches/*.md >> /tmp/tz.txt
          manifest=$(awk '/^## Must-fire manifest/{f=1;next} /^## /{f=0} f' EVALS.md | grep -oE 'references/[a-zA-Z0-9/_-]+\.md' | sort -u)
          if [ -z "$manifest" ]; then echo "must-fire manifest empty or missing in EVALS.md"; exit 1; fi
          rc=0
          for ref in $manifest; do
            test -f "$ref" || { echo "MANIFEST LISTS MISSING FILE: $ref"; rc=1; continue; }
            base=$(basename "$ref")
            grep -qF "$base" /tmp/tz.txt || { echo "DARK (no live trigger, only catalogued): $ref"; rc=1; }
          done
          if [ $rc -ne 0 ]; then exit 1; fi
          echo "✓ All must-fire refs have a live situation-trigger"
