name: Validate skill

# Every PR and every push to main, whatever it touches: hooks/*.sh and install.sh are code, and a
# paths filter on *.md let changes to them merge untested. The jobs only call scripts in tests/, so
# `bash tests/run-all.sh` locally is the same gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content:
    name: Content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/check-content.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version && shellcheck -S warning hooks/*.sh install.sh tests/*.sh

  scripts:
    name: Scripts (${{ matrix.os }}, ${{ matrix.bash }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          - os: macos-latest      # stock /bin/bash is 3.2 — the oldest bash shipright's hooks support
            bash: /bin/bash
          - os: windows-latest    # Git Bash; backslash paths + the Store python alias live here
            bash: bash
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Behaviour tests (boundary-guard, check-update, install.sh)
        env:
          BASH_BIN: ${{ matrix.bash }}
          REQUIRE_PARSER: '1'
        run: ${{ matrix.bash }} tests/hooks.test.sh
