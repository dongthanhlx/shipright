name: Validate skill

# Every PR and every push to main, whatever it touches: hooks/*.sh and install.sh are code, and a
# paths filter on *.md let changes to them merge untested. The jobs only call scripts in tests/, so
# `bash tests/run-all.sh` locally is the same gate.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content:
    name: Content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash tests/check-content.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck --version && shellcheck -S warning hooks/*.sh install.sh tests/*.sh

  plugin:
    name: Plugin manifest (claude plugin validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The official validator; needs no login. Pinned so a new CLI release can't redden CI unannounced —
      # bump it deliberately. Warnings (CLAUDE.md at the root, no listing icon) are expected and pass.
      - run: npx -y @anthropic-ai/claude-code@2.1.312 plugin validate .

  scripts:
    name: Scripts (${{ matrix.os }}, ${{ matrix.bash }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          - os: windows-latest    # Git Bash; backslash paths + the Store python alias live here
            bash: bash
          # Best effort: GitHub's macOS arm64 pool often has no runner to give (v1.27.2's job was never
          # picked up). bash 3.2 itself is covered by the container job below; this one adds the BSD
          # userland (sed/awk/grep/mktemp, no coreutils `timeout`) when a runner is available.
          - os: macos-latest
            bash: /bin/bash
            best_effort: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.best_effort == true }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Behaviour tests (boundary-guard, check-update, install.sh)
        env:
          BASH_BIN: ${{ matrix.bash }}
          REQUIRE_PARSER: '1'
        run: ${{ matrix.bash }} tests/hooks.test.sh

  bash32:
    name: Scripts (bash 3.2, container)
    # The oldest bash the hooks support (stock macOS), without waiting on a macOS runner. Checkout on
    # the host, run inside bash:3.2 (Alpine/busybox userland: this checks bash semantics; the macOS
    # job checks BSD tools). `docker run` rather than `container:` so no JS action runs on musl.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Behaviour tests under bash 3.2
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e REQUIRE_PARSER=1 -e BASH_BIN=/usr/local/bin/bash \
            bash:3.2 bash -c '
              apk add --no-cache git jq >/dev/null &&
              git config --global --add safe.directory "*" &&
              bash --version | head -1 &&
              bash tests/hooks.test.sh'
