name: Validate skill

on:
  pull_request:
    paths: ['**/*.md', 'SKILL.md']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check SKILL.md has required fields
        run: |
          grep -q "^name: shipright" SKILL.md || (echo "Missing name field" && exit 1)
          grep -q "^version:" SKILL.md || (echo "Missing version field" && exit 1)
          grep -q "^description:" SKILL.md || (echo "Missing description field" && exit 1)
          echo "✓ SKILL.md frontmatter valid"

      - name: Check all branch files exist
        run: |
          for branch in a-new-project b-add-feature c-fix-bug d-refactor e-resume f-incident; do
            test -f "references/branches/${branch}.md" || (echo "Missing: ${branch}.md" && exit 1)
          done
          echo "✓ All branch files present"

      - name: Check examples exist
        run: |
          test -f "references/examples/news-crawler-CLAUDE.md" || (echo "Missing example" && exit 1)
          test -f "references/examples/news-crawler-ARCHITECTURE.md" || (echo "Missing example" && exit 1)
          echo "✓ Example files present"

      - name: Check no broken internal reference links (hard fail)
        run: |
          # CHANGELOG is a historical record — allowed to mention intentionally-removed files.
          grep -rhoE 'references/[a-zA-Z0-9/_-]+\.md' --include='*.md' --exclude=CHANGELOG.md . | sort -u > /tmp/refs.txt
          rc=0
          while read ref; do
            if [ ! -f "$ref" ]; then echo "BROKEN LINK: $ref"; rc=1; fi
          done < /tmp/refs.txt
          if [ $rc -ne 0 ]; then exit 1; fi
          echo "✓ No broken reference links"

      - name: Check no orphaned reference files (hard fail)
        run: |
          # A reference file must be linked from a live file (CHANGELOG mention does not count).
          rc=0
          for f in $(find references -name '*.md'); do
            base=$(basename "$f")
            if ! grep -rqF "$base" --include='*.md' --exclude="$base" --exclude=CHANGELOG.md .; then
              echo "ORPHAN (referenced nowhere live): $f"; rc=1
            fi
          done
          if [ $rc -ne 0 ]; then exit 1; fi
          echo "✓ No orphaned reference files"
